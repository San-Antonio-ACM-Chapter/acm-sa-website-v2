name: Render Deploy

on:
  push:
    branches:
      - main
      - feature/no-ref/add-build-actions
  workflow_dispatch:

concurrency:
  group: render-production
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint checks
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test -- --runInBand

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: ${{ needs.lint.result == 'success' && needs.test.result == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  notify-ci-failure:
    name: Notify Discord CI Failure
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: ${{ always() && (needs.lint.result == 'failure' || needs.test.result == 'failure') }}

    steps:
      - name: Send CI failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_WEBHOOK_URL secret."
            exit 1
          fi

          payload=$(cat <<EOF
          {
            "content": "CI checks failed for \`$REPOSITORY\` on \`$BRANCH\` by \`$ACTOR\`.\nCommit: \`$SHA\`\nLint: \`$LINT_RESULT\`\nTest: \`$TEST_RESULT\`\nWorkflow: $RUN_URL"
          }
          EOF
          )

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' && github.ref_name == 'main' }}

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

  notify-failure:
    name: Notify Discord Failure
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}

    steps:
      - name: Send failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_WEBHOOK_URL secret."
            exit 1
          fi

          payload=$(cat <<EOF
          {
            "content": "Build or deploy failed for \`$REPOSITORY\` on \`$BRANCH\` by \`$ACTOR\`.\nCommit: \`$SHA\`\nBuild: \`$BUILD_RESULT\`\nDeploy: \`$DEPLOY_RESULT\`\nWorkflow: $RUN_URL"
          }
          EOF
          )

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"

  notify-success:
    name: Notify Discord Success
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
      - deploy
    if: ${{ always() && needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && (needs.deploy.result == 'success' || (needs.deploy.result == 'skipped' && github.ref_name != 'main')) }}

    steps:
      - name: Send success notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_WEBHOOK_URL secret."
            exit 1
          fi

          payload=$(cat <<EOF
          {
            "content": "Workflow passed for \`$REPOSITORY\` on \`$BRANCH\` by \`$ACTOR\`.\nCommit: \`$SHA\`\nDeploy status: \`$DEPLOY_RESULT\`\nWorkflow: $RUN_URL"
          }
          EOF
          )

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
