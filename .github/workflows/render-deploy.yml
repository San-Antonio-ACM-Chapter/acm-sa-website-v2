name: Render Deploy

on:
  push:
    branches:
      - main
      - feature/no-ref/add-build-actions
  workflow_dispatch:

concurrency:
  group: render-production
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint checks
        run: npm run lint

      - name: Run test suite
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ needs.ci.result == 'success' && github.ref_name == 'main' }}

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs:
      - ci
      - deploy
    if: ${{ always() }}

    steps:
      - name: Send success notification
        if: ${{ needs.ci.result == 'success' && (needs.deploy.result == 'success' || (needs.deploy.result == 'skipped' && github.ref_name != 'main')) }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_WEBHOOK_URL secret."
            exit 1
          fi

          payload=$(cat <<EOF
          {
            "content": "Workflow passed for \`$REPOSITORY\` on \`$BRANCH\` by \`$ACTOR\`.\nCommit: \`$SHA\`\nDeploy status: \`${{ needs.deploy.result }}\`\nWorkflow: $RUN_URL"
          }
          EOF
          )

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"

      - name: Send failure notification
        if: ${{ needs.ci.result != 'success' || needs.deploy.result == 'failure' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          CI_RESULT: ${{ needs.ci.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_WEBHOOK_URL secret."
            exit 1
          fi

          payload=$(cat <<EOF
          {
            "content": "Render deploy blocked or failed for \`$REPOSITORY\` on \`$BRANCH\` by \`$ACTOR\`.\nCommit: \`$SHA\`\nCI result: \`$CI_RESULT\`\nDeploy result: \`$DEPLOY_RESULT\`\nWorkflow: $RUN_URL"
          }
          EOF
          )

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
