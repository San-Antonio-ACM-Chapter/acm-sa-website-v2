version: '3.8'

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    volumes:
      - ..:/app:cached
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - ACCOUNT_ZONE_URL=http://localhost:3001
    command: npm run dev
    stdin_open: true
    tty: true

